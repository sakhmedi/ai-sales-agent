services:
  api:
    build: .
    env_file: .env
    environment:
      # Absolute path inside the container; ./data is mounted there, so the db survives restarts.
      DATABASE_URL: sqlite:////app/data/app.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
